services:
  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    restart: unless-stopped
    user: "1000:1000"
    group_add:
      - "44"
      - "992"
    devices:
      - /dev/dri:/dev/dri
    ports:
      - "127.0.0.1:8096:8096"
    environment:
      TZ: Europe/Paris
    volumes:
      - ./config:/config
      - ./cache:/cache
      - /home/alex/media:/media
      - /home/alex/media/musique:/media/musique:ro   # musique protégée (Navidrome)
