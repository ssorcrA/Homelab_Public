services:
  stirling:
    image: stirlingtools/stirling-pdf:latest
    container_name: stirling
    restart: unless-stopped
    mem_limit: 1g
    ports:
      - "127.0.0.1:8084:8080"
    environment:
      DISABLE_ADDITIONAL_FEATURES: "true"
      SECURITY_ENABLELOGIN: "false"
      LANGS: fr_FR
      SYSTEM_DEFAULTLOCALE: fr-FR
    volumes:
      - ./tessdata:/usr/share/tessdata
      - ./config:/configs
